<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNCS Payroll Management System</title>

  <!-- ── CSS: Load order matters ──
       1. theme.css  — CSS variables (edit for color palette)
       2. base.css   — reset, shared components (cards, tables, badges, buttons)
       3. layout.css — sidebar, topbar, main shell
       4. role CSS   — role-specific overrides and unique components
  -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/accountant.css">
  <link rel="stylesheet" href="css/employee.css">

  <!-- LOGIN SCREEN STYLES (inlined here since it's small and entry-specific) -->
  <style>
    #s-login {
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    #s-login::before {
      content: '';
      position: absolute;
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(245,166,35,0.07) 0%, transparent 65%);
      top: -200px; right: -160px; pointer-events: none;
    }
    #s-login::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(29,184,160,0.05) 0%, transparent 65%);
      bottom: -120px; left: -100px; pointer-events: none;
    }
    .lc {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--rl);
      padding: 48px 44px;
      width: 430px;
      position: relative;
      z-index: 1;
      animation: fu .5s ease both;
      transition: background 0.25s, border-color 0.25s;
    }
    @keyframes fu {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .l-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
    .l-icon  {
      width: 44px; height: 44px; background: var(--amber);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #0D1B2A; font-family: var(--mono);
    }
    .l-name .school { display: block; font-size: 10px; color: var(--t2); letter-spacing: .07em; text-transform: uppercase; }
    .l-name .sys    { display: block; font-size: 15px; font-weight: 600; color: var(--t1); }
    .l-title { font-size: 22px; font-weight: 700; color: var(--t1); margin-bottom: 6px; }
    .l-sub   { font-size: 13px; color: var(--t2); margin-bottom: 28px; }
    .l-field-label { font-size: 10px; font-weight: 600; color: var(--t2); margin-bottom: 9px; letter-spacing: .05em; text-transform: uppercase; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .rb {
      padding: 12px 6px; border-radius: 9px;
      background: var(--bg3); border: 1.5px solid var(--border);
      color: var(--t2); font-family: var(--sans); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all .18s; text-align: center; line-height: 1.4;
    }
    .rb .rb-icon { font-size: 20px; display: block; margin-bottom: 4px; }
    .rb.sel      { background: var(--amber-s); border-color: var(--amber); color: var(--amber); }
    .rb:hover:not(.sel) { border-color: var(--t3); color: var(--t1); }
    .fl { margin-bottom: 16px; }
    .fl label {
      display: block; font-size: 11px; font-weight: 500; color: var(--t2);
      margin-bottom: 7px; letter-spacing: .05em; text-transform: uppercase;
    }
    .fi {
      width: 100%; padding: 11px 14px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--t1);
      font-family: var(--sans); font-size: 14px; outline: none;
      transition: border-color .2s, background 0.25s;
    }
    .fi:focus { border-color: var(--amber); }
    .fi::placeholder { color: var(--t3); }
    .lb {
      width: 100%; padding: 13px;
      background: var(--amber); border: none; border-radius: var(--r);
      color: #0D1B2A; font-family: var(--sans); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .18s; margin-top: 8px;
    }
    .lb:hover { background: var(--amber2); }
    .lf { margin-top: 20px; text-align: center; font-size: 11px; color: var(--t3); }
  </style>
</head>
<body>

  <!--
    ═══════════════════════════════════════════════
    PAGE FRAGMENTS
    Each file owns its own section of the UI.
    Team members edit their assigned file only.

    File ownership suggestion:
      pages/login.html       → any team member (shared)
      pages/admin.html       → Admin UI developer
      pages/accountant.html  → Accountant UI developer
      pages/employee.html    → Employee UI developer
      css/theme.css          → Design lead (colors)
      css/base.css           → Shared component owner
      css/layout.css         → Layout owner
      css/admin.css          → Admin UI developer
      css/accountant.css     → Accountant UI developer
      css/employee.css       → Employee UI developer
      js/app.js              → Lead developer (auth, routing)
      js/admin.js            → Admin feature developer
      js/accountant.js       → Accountant feature developer
      js/employee.js         → Employee feature developer
    ═══════════════════════════════════════════════
  -->

  <!-- LOGIN -->
  <div id="fragment-login"></div>

  <!-- ADMIN APP -->
  <div id="fragment-admin"></div>

  <!-- ACCOUNTANT APP -->
  <div id="fragment-accountant"></div>

  <!-- EMPLOYEE APP -->
  <div id="fragment-employee"></div>

  <!-- ── JS: Load order matters ──
       1. app.js         — theme, login, logout (load first)
       2. admin.js       — admin navigation + actions
       3. accountant.js  — accountant navigation + payroll calc
       4. employee.js    — employee interactions
  -->
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/accountant.js"></script>
  <script src="js/employee.js"></script>

  <!-- FRAGMENT LOADER
       Fetches each HTML fragment and injects it.
       In production, replace with server-side include
       or a framework component system.
  -->
  <script>
    async function loadFragment(containerId, filePath) {
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`Failed to load ${filePath}`);
        const html = await res.text();
        document.getElementById(containerId).innerHTML = html;
      } catch (e) {
        console.error(e);
      }
    }

    Promise.all([
      loadFragment('fragment-login',      'pages/login.html'),
      loadFragment('fragment-admin',      'pages/admin.html'),
      loadFragment('fragment-accountant', 'pages/accountant.html'),
      loadFragment('fragment-employee',   'pages/employee.html'),
    ]).then(() => {
      // Re-run DOMContentLoaded listeners after fragments are injected
      document.dispatchEvent(new Event('DOMContentLoaded'));
      // Apply saved theme to newly injected toggle buttons
      const saved = localStorage.getItem('bncs-theme') || 'dark';
      applyTheme(saved);
    });
  </script>

</body>
</html>
